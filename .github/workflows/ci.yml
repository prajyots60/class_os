name: CI

on:
  push:
    branches:
      - master
      - main
      - develop
  pull_request:
    branches:
      - master
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Check code formatting (Prettier)
        run: pnpm format:check

      - name: Run ESLint across workspace
        run: pnpm lint

      - name: Run TypeScript typecheck across workspace
        run: pnpm typecheck

  database-and-tests:
    name: Database Migrations & Integration Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coachingos_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/coachingos_ci?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/coachingos_ci?schema=public
      BETTER_AUTH_SECRET: ci_only_deterministic_secret_key_32_chars_min
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Validate environment variables
        run: pnpm env:check

      - name: Validate Prisma schema
        run: pnpm db:validate

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Deploy Prisma migrations to clean CI PostgreSQL
        run: pnpm db:migrate:deploy

      - name: Verify Prisma migration status
        run: pnpm db:status

      - name: Verify Prisma schema drift (schema vs database migrations)
        run: pnpm db:drift:check

      - name: Verify PostgreSQL connectivity & health
        run: pnpm db:health

      - name: Seed development test records
        run: pnpm db:seed

      - name: Verify Better Auth 1.6.26 foundation
        run: pnpm verify:auth

      - name: Verify Pino, request ID & error taxonomy
        run: pnpm verify:infra

      - name: Execute Vitest unit & integration test suites
        run: pnpm test

  e2e:
    name: Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: [quality, database-and-tests]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: coachingos_ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci_password@localhost:5432/coachingos_ci?schema=public
      TEST_DATABASE_URL: postgresql://ci:ci_password@localhost:5432/coachingos_ci?schema=public
      BETTER_AUTH_SECRET: ci_only_deterministic_secret_key_32_chars_min
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      PORT: 3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Deploy Prisma migrations to clean CI PostgreSQL
        run: pnpm db:migrate:deploy

      - name: Install Playwright Chromium with system dependencies
        run: pnpm exec playwright install --with-deps chromium

      - name: Execute Playwright E2E browser tests
        run: pnpm test:e2e

      - name: Upload Playwright test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  build:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [quality, database-and-tests, e2e]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Execute Turborepo production build
        run: pnpm build
